app-id: app.splitcommander
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: splitcommander
finish-args:
  # Grafik & Anzeige
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  
  # Netzwerk & Sockets (z.B. für Git, Paperless, Netzlaufwerke)
  - --share=network
  
  # Dateimanager-Rechte (Zwingend erforderlich)
  - --filesystem=host             # Ermöglicht Vollzugriff auf das Dateisystem des Nutzers
  - --filesystem=/media           # Für externe Laufwerke/USB-Sticks
  - --filesystem=/run/media       # Für automatisch gemountete Laufwerke in KDE
  - --filesystem=xdg-run/gvfs     # Zugriff auf KIO/GVfs Netzwerkmounts
  - --filesystem=xdg-run/gvfsd
  
  # DBus-Schnittstellen zur tiefen Systemintegration
  - --system-talk-name=org.freedesktop.UDisks2  # ZWINGEND: Damit Laufwerke in der Seitenleiste auftauchen
  - --talk-name=org.freedesktop.FileManager1    # Um als Standard-Dateimanager zu agieren
  - --talk-name=org.kde.baloo                  # Baloo-Suchindex-Abfragen
  - --talk-name=org.freedesktop.Notifications  # Systembenachrichtigungen
  - --talk-name=org.freedesktop.secrets        # Für Git-Passwörter / KWallet
  - --own-name=org.freedesktop.FileManager1

modules:
  - name: lmdb
    no-autogen: true
    make-install-args:
      - prefix=/app
    subdir: libraries/liblmdb
    sources:
      - type: archive
        url: https://git.openldap.org/openldap/openldap/-/archive/LMDB_0.9.35/openldap-LMDB_0.9.35.tar.bz2
        sha256: 98e28ab0a5c23fb2eb8ad12c12d7ad5fc5e4c3563f41d0b91e9420a075974d6f

  - name: baloo
    config-opts:
      - -DBUILD_TESTING=OFF
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://download.kde.org/stable/frameworks/6.11/baloo-6.11.0.tar.xz
        sha256: bb87d40534a00cc363d29e3d7d0f37a9dcdd0d831db1a57bbf8b8e395507560a


  - name: splitcommander
    buildsystem: cmake-ninja
    config-opts:
      # Alle optionalen Plugins standardmäßig im Flatpak-Build aktivieren
      - -DSC_PLUGIN_GIT=ON
      - -DSC_PLUGIN_PAPERLESS=ON
      - -DSC_PLUGIN_MOUNTISO=ON
      - -DSC_PLUGIN_MAKEFILEACTIONS=ON
    sources:
      - type: dir
        path: .
